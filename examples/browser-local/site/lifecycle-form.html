<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="revision" content="lifecycle-1">
<title>Library card request</title>
</head>
<body>
<h1>Library card request</h1>
<p>Ask the branch to hold a title for you.</p>
<form id="library-card" action="/submit" method="post">
<label>Title <input name="requested_item" type="text" required></label>
<label>Pickup branch <input name="pickup_branch" type="text"></label>
<label>Note <textarea name="note"></textarea></label>
<button type="submit">Send request</button>
</form>
</body>
</html>
